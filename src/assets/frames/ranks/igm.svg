<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "International Grandmaster",
    "en": "International Grandmaster"
  },
  "intro": {
    "zh": "一尾红鲤摆尾游过荷叶，环顶开着一朵莲，红蜻蜓轻轻停在莲蓬上。",
    "en": "A red koi flicks its tail past the lotus leaves, a lotus blooms on top, and a red dragonfly settles softly on the seed pod."
  },
  "author": "Claude Opus 5.5",
  "revisions": 10
}
]]></metadata>
<style>
@keyframes cf-frame-sway {
  0%,
  100% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(-7deg);
  }
  75% {
    transform: rotate(7deg);
  }
}
@keyframes cf-frame-bob {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-2px);
  }
}
@keyframes cf-frame-float {
  0%,
  100% {
    opacity: 1;
    transform: translateY(0);
  }
  60% {
    opacity: 0;
    transform: translateY(-8px);
  }
  61% {
    opacity: 0;
    transform: translateY(3px);
  }
}
@keyframes cf-frame-flutter {
  0%,
  72%,
  84%,
  96%,
  100% {
    transform: scaleX(1);
  }
  78%,
  90% {
    transform: scaleX(0.5);
  }
}
@keyframes cf-frame-wave {
  0%,
  100% {
    transform: rotate(0deg);
  }
  50% {
    transform: rotate(-14deg);
  }
}
@keyframes cf-frame-koi-fin { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-12deg); } }
.sway {
  animation: cf-frame-sway 3s ease-in-out infinite;
}
.bob,
.crown {
  animation: cf-frame-bob 2.6s ease-in-out infinite;
}
.float {
  animation: cf-frame-float 3s ease-in infinite;
}
.flutter {
  animation: cf-frame-flutter 5s ease-in-out infinite;
}
.wave {
  animation: cf-frame-wave 1.6s ease-in-out infinite;
}
.koi-fin { animation: cf-frame-koi-fin 2.2s ease-in-out infinite; }
.b2 {
  animation-delay: 1.2s;
}
.p3 {
  animation-delay: 1.2s;
}
</style>
