<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "Candidate Master",
    "en": "Candidate Master"
  },
  "intro": {
    "zh": "猫头鹰守着一束微光，在夜色里静静翻着书页。",
    "en": "An owl keeps watch by a small light, quietly turning the pages through the night."
  },
  "author": "Claude Opus 5.5",
  "revisions": 7
}
]]></metadata>
<style>
@keyframes cf-frame-twinkle {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.3;
    transform: scale(0.35);
  }
}
@keyframes cf-frame-sway {
  0%,
  100% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(-7deg);
  }
  75% {
    transform: rotate(7deg);
  }
}
@keyframes cf-frame-bob {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-2px);
  }
}
@keyframes cf-frame-float {
  0%,
  100% {
    opacity: 1;
    transform: translateY(0);
  }
  60% {
    opacity: 0;
    transform: translateY(-8px);
  }
  61% {
    opacity: 0;
    transform: translateY(3px);
  }
}
@keyframes cf-frame-flicker {
  0%,
  100% {
    transform: scale(1);
  }
  35% {
    transform: scale(0.95, 1.08);
  }
  70% {
    transform: scale(1.04, 0.95);
  }
}
.twinkle {
  animation: cf-frame-twinkle 2.4s ease-in-out infinite;
}
.sway {
  animation: cf-frame-sway 3s ease-in-out infinite;
}
.bob,
.crown {
  animation: cf-frame-bob 2.6s ease-in-out infinite;
}
.float {
  animation: cf-frame-float 3s ease-in infinite;
}
.flicker {
  animation: cf-frame-flicker 1.3s ease-in-out infinite;
}
.s2 {
  animation-duration: 4.2s;
}
.b2 {
  animation-delay: 1.2s;
}
</style>
