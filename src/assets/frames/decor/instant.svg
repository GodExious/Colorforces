<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "拍立得",
    "en": "Instant Camera"
  },
  "intro": {
    "zh": "咔嚓，闪光灯一亮，顶上吐出一张相纸，颜色一点一点显出来。",
    "en": "Click. The flash goes off, a photo slides out of the top, and its colors slowly come through."
  },
  "author": "Claude Opus 5.5",
  "revisions": 0
}
]]></metadata>
<style>
@keyframes cf-frame-cam-photo {
  0%, 12% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
  20% { opacity: 0; transform: translate(7px, 0) rotate(3deg); }
  20.5% { opacity: 0; transform: translate(0, 15px) rotate(0deg); }
  22%, 48% { opacity: 1; transform: translate(0, 15px) rotate(0deg); animation-timing-function: cubic-bezier(0.2, 0.6, 0.3, 1); }
  64%, 100% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
}
@keyframes cf-frame-cam-develop {
  0%, 20.5% { opacity: 0; }
  21%, 64% { opacity: 1; }
  92%, 100% { opacity: 0; }
}
@keyframes cf-frame-cam-flash {
  0%, 40%, 49%, 100% { opacity: 0; }
  41.5% { opacity: 1; }
}
@keyframes cf-frame-cam-rays {
  0%, 40%, 49%, 100% { opacity: 0; transform: scale(0.7); }
  42% { opacity: 1; transform: scale(1); }
}
@keyframes cf-frame-cam-button {
  0%, 37%, 42%, 100% { transform: scale(1); }
  39%, 40.5% { transform: scale(0.84); }
}
.cam-b-photo { animation: cf-frame-cam-photo 8s infinite; }
.cam-b-develop { animation: cf-frame-cam-develop 8s infinite; }
.cam-b-flash { animation: cf-frame-cam-flash 8s infinite; }
.cam-b-rays { animation: cf-frame-cam-rays 8s infinite; }
.cam-b-press { animation: cf-frame-cam-button 8s infinite; }
</style>
