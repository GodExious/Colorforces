<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "蝴蝶结",
    "en": "Ribbon Bow"
  },
  "intro": {
    "zh": "奶油色的环，系着一只蝴蝶结，挂着一颗小铃铛。",
    "en": "A cream ring tied with a bow, with a little bell hanging from it."
  },
  "author": "Claude Opus 5.5",
  "revisions": 1
}
]]></metadata>
<style>
@keyframes cf-frame-twinkle {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.3;
    transform: scale(0.35);
  }
}
@keyframes cf-frame-sway {
  0%,
  100% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(-7deg);
  }
  75% {
    transform: rotate(7deg);
  }
}
.twinkle {
  animation: cf-frame-twinkle 2.4s ease-in-out infinite;
}
.sway {
  animation: cf-frame-sway 3s ease-in-out infinite;
}
.ring-bell {
  animation: cf-frame-sway 1.8s ease-in-out infinite;
}
</style>
