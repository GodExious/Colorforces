<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "小黄鸭",
    "en": "Rubber Duck"
  },
  "intro": {
    "zh": "把代码一行行讲给小黄鸭听，讲着讲着，灯就亮了。",
    "en": "Talk your code through to the rubber duck, line by line, until the bulb lights up."
  },
  "author": "Claude Opus 5.5",
  "revisions": 0
}
]]></metadata>
<style>
@keyframes cf-frame-float {
  0%,
  100% {
    opacity: 1;
    transform: translateY(0);
  }
  60% {
    opacity: 0;
    transform: translateY(-8px);
  }
  61% {
    opacity: 0;
    transform: translateY(3px);
  }
}
@keyframes cf-frame-dca-lit {
  0%, 45% { opacity: 1; animation-timing-function: ease-in-out; }
  52.5%, 90% { opacity: 0; animation-timing-function: ease-out; }
  96.25%, 100% { opacity: 1; }
}
@keyframes cf-frame-dca-rays {
  0% { opacity: 1; transform: scale(1); animation-timing-function: ease-out; }
  11.25% { opacity: 0; transform: scale(1.1); }
  90.625% { opacity: 0; transform: scale(0.6); animation-timing-function: ease-out; }
  97.5% { opacity: 1; transform: scale(1.08); animation-timing-function: ease-in-out; }
  100% { opacity: 1; transform: scale(1); }
}
@keyframes cf-frame-dca-head {
  0%, 55% { transform: rotate(0deg); animation-timing-function: ease-in-out; }
  62.5%, 85% { transform: rotate(-12deg); animation-timing-function: ease-in-out; }
  91.25% { transform: rotate(5deg); animation-timing-function: ease-in-out; }
  97.5%, 100% { transform: rotate(0deg); }
}
.float {
  animation: cf-frame-float 3s ease-in infinite;
}
.dca-lit { animation: cf-frame-dca-lit 8s infinite; }
.dca-rays { animation: cf-frame-dca-rays 8s infinite; }
.dca-head { animation: cf-frame-dca-head 8s infinite; }
.t2 {
  animation-delay: 0.8s;
}
.q2 {
  animation-delay: 1.3s;
}
.q3 {
  animation-delay: 2.6s;
}
</style>
