<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "耳机",
    "en": "Headphones"
  },
  "intro": {
    "zh": "戴上耳机，低音像心跳一样咚、咚地震，耳罩跟着鼓动，环上的光随着闪烁，敲代码也踩上了点。",
    "en": "Headphones on. The bass beats like a heart, thump-thump, the ear cups pulse along, the ring flashes in time, and even the typing falls into rhythm."
  },
  "author": "Claude Opus 5.5",
  "revisions": 2
}
]]></metadata>
<style>
@keyframes cf-frame-ph-wave {
  0% { opacity: 1; transform: scale(1); animation-timing-function: ease-out; }
  45%, 100% { opacity: 0; transform: scale(1.4); }
}
@keyframes cf-frame-ph-thump {
  0% { transform: scale(1.045); animation-timing-function: ease-out; }
  10% { transform: scale(1); animation-timing-function: ease-in; }
  15% { transform: scale(1.03); animation-timing-function: ease-out; }
  32%, 100% { transform: scale(1); }
}
@keyframes cf-frame-ph-glow {
  0% { opacity: 0.7; animation-timing-function: ease-out; }
  10% { opacity: 0.25; animation-timing-function: ease-in; }
  15% { opacity: 0.55; animation-timing-function: ease-out; }
  40%, 100% { opacity: 0.12; }
}
.ph-wave { animation: cf-frame-ph-wave 2.4s infinite; }
.ph-wave-b { animation: cf-frame-ph-wave 2.4s infinite; animation-delay: 0.36s; }
.ph-thump { animation: cf-frame-ph-thump 2.4s infinite; }
.ph-glow { animation: cf-frame-ph-glow 2.4s infinite; }
</style>
