<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "Joker",
    "en": "Joker"
  },
  "intro": {
    "zh": "一黑一红两张王牌，帽尖的金铃轻轻一晃，好戏就要开场。",
    "en": "One black joker and one red. The gold bell on the jester’s cap gives a little shake, and the show is about to begin."
  },
  "author": "Claude Opus 5.5",
  "revisions": 1
}
]]></metadata>
<style>
@keyframes cf-frame-twinkle {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.3;
    transform: scale(0.35);
  }
}
@keyframes cf-frame-sway {
  0%,
  100% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(-7deg);
  }
  75% {
    transform: rotate(7deg);
  }
}
.twinkle {
  animation: cf-frame-twinkle 2.4s ease-in-out infinite;
}
.sway {
  animation: cf-frame-sway 3s ease-in-out infinite;
}
.s2 {
  animation-duration: 4.2s;
}
</style>
