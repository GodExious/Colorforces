  "name": {
    "zh": "行星",
    "en": "Ringed Planet"
  },
  "intro": {
    "zh": "头像成了一颗套着光环的行星，小火箭绕着它慢慢飞。",
    "en": "The avatar becomes a ringed planet, with a little rocket slowly circling it."
  },
  "author": "Claude Opus 5.5",
  "revisions": 0
}
]]></metadata>
