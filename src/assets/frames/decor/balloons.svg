<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "气球",
    "en": "Balloons"
  },
  "intro": {
    "zh": "每过一题，就有一只气球升起来。环上已经拴了五只。",
    "en": "Every solved problem sends up a balloon, and five are already tied to the ring."
  },
  "author": "Claude Opus 5.5",
  "revisions": 0
}
]]></metadata>
<style>
@keyframes cf-frame-fall {
  0%,
  100% {
    opacity: 1;
    transform: translateY(0);
  }
  70% {
    opacity: 0;
    transform: translateY(14px);
  }
  71% {
    opacity: 0;
    transform: translateY(-5px);
  }
}
@keyframes cf-frame-dca-float {
  0%, 100% { transform: rotate(0deg); }
  30% { transform: rotate(-4deg); }
  70% { transform: rotate(3deg); }
}
.fall {
  animation: cf-frame-fall 4s ease-in infinite;
}
.dca-float { animation: cf-frame-dca-float 6s ease-in-out infinite; }
.q2 {
  animation-delay: 1.3s;
}
.q3 {
  animation-delay: 2.6s;
}
.dca-b2 { animation-delay: 0.7s; }
.dca-b3 { animation-delay: 1.4s; }
</style>
