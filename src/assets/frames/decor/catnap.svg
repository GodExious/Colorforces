.nb-zz { animation: cf-frame-nb-zz 6s ease-in-out infinite; }
.nb-roll { animation: cf-frame-nb-roll 6s ease-in-out infinite; }
.nb-z2 { animation-delay: 2s; }
.nb-z3 { animation-delay: 4s; }
</style>
