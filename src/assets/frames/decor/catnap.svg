<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "猫午睡",
    "en": "Cat Nap"
  },
  "intro": {
    "zh": "玩累了的小猫蜷在环顶睡着了，毛线球滚在一边，尾巴轻轻地摆。",
    "en": "Worn out from play, a kitten curls up asleep on the ring, its yarn rolled aside and its tail swaying gently."
  },
  "author": "Claude Opus 5.5",
  "revisions": 0
}
]]></metadata>
