<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "tourist",
    "en": "tourist"
  },
  "intro": {
    "zh": [
      "传奇之上的段位。根据一篇报道，tourist 这个名字他从小学起就在用，取自他第一副儿童滑雪板的牌子，所以这里立着一副滑雪板和一对雪杖，头像戴着毛线帽。",
      "纪念他于 2024-08-30 达到 4009 分，这是有史以来第一次有人超过 4000 分。"
    ],
    "en": [
      "A rank above Legendary. According to a news report, he has used the name tourist since primary school. It was the brand of his first childhood skis, so a pair of skis and poles stand here and the avatar wears a bobble hat.",
      "Celebrating his 4009 on 2024-08-30, the first time anyone passed 4000."
    ]
  },
  "author": "Claude Opus 5.5",
  "revisions": 8
}
]]></metadata>
<style>
@keyframes cf-frame-sway {
  0%,
  100% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(-7deg);
  }
  75% {
    transform: rotate(7deg);
  }
}
@keyframes cf-frame-bob {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-2px);
  }
}
@keyframes cf-frame-lean {
  0%,
  50%,
  100% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(-1.6deg);
  }
  75% {
    transform: rotate(1.2deg);
  }
}
@keyframes cf-frame-slide {
  0%,
  100% {
    opacity: 0;
    transform: translateY(0);
  }
  10%,
  40% {
    opacity: 0.85;
  }
  50%,
  99% {
    opacity: 0;
    transform: translateY(-56px);
  }
}
@keyframes cf-frame-fall {
  0%,
  100% {
    opacity: 1;
    transform: translateY(0);
  }
  70% {
    opacity: 0;
    transform: translateY(14px);
  }
  71% {
    opacity: 0;
    transform: translateY(-5px);
  }
}
.sway {
  animation: cf-frame-sway 3s ease-in-out infinite;
}
.bob,
.crown {
  animation: cf-frame-bob 2.6s ease-in-out infinite;
}
.lean {
  animation: cf-frame-lean 6s ease-in-out infinite;
}
.slide {
  animation: cf-frame-slide 4s ease-in-out infinite;
}
.fall {
  animation: cf-frame-fall 4s ease-in infinite;
}
.s3 {
  animation-delay: 1.5s;
}
.q2 {
  animation-delay: 1.3s;
}
.q3 {
  animation-delay: 2.6s;
}
</style>
