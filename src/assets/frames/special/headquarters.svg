<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 160 160">
<metadata><![CDATA[
{
  "format": "colorforces-frame",
  "version": 1,
  "name": {
    "zh": "Headquarters",
    "en": "Headquarters"
  },
  "intro": {
    "zh": [
      "管理员的头像框。",
      "每年新年，MikeMirzayanov 都会发一篇博客给大家送「礼物」，其中每年都有的一件是开放改名，所以 Codeforces 标志的三根柱子变成了三个礼物盒，最高的那个挂着 handle 标签。旁边飞着的几架小纸飞机代表 Telegram：它从 2014 年起赞助了 Codeforces 多年，2026 年 9 月又一次成为赞助商。"
    ],
    "en": [
      "The frame for Headquarters.",
      "Every New Year, MikeMirzayanov posts a blog of gifts, and every year one of them is a handle change, so the three bars of the Codeforces logo become three gift boxes, the tallest with a handle tag. The small paper planes stand for Telegram, which sponsored Codeforces for years from 2014 and became its sponsor again in September 2026."
    ]
  },
  "author": "Claude Opus 5.5",
  "revisions": 2
}
]]></metadata>
<style>
@keyframes cf-frame-spin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes cf-frame-twinkle {
  0%,
  100% {
    opacity: 1;
    transform: scale(1);
  }
  50% {
    opacity: 0.3;
    transform: scale(0.35);
  }
}
@keyframes cf-frame-sway {
  0%,
  100% {
    transform: rotate(0deg);
  }
  25% {
    transform: rotate(-7deg);
  }
  75% {
    transform: rotate(7deg);
  }
}
@keyframes cf-frame-bob {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-2px);
  }
}
.twinkle {
  animation: cf-frame-twinkle 2.4s ease-in-out infinite;
}
.sway {
  animation: cf-frame-sway 3s ease-in-out infinite;
}
.bob,
.crown {
  animation: cf-frame-bob 2.6s ease-in-out infinite;
}
.orbit {
  animation: cf-frame-spin 9s linear infinite;
}
.t2 {
  animation-delay: 0.8s;
}
.d2 {
  animation-direction: reverse;
}
.s2 {
  animation-duration: 4.2s;
}
.slow {
  animation-duration: 24s;
}
</style>
