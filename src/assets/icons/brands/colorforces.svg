<svg xmlns="http://www.w3.org/2000/svg" class="cf-launcher-art" viewBox="0 0 44 44" aria-hidden="true" focusable="false">
  <defs>
    <path id="cf-flower-petal-form" d="M22 24C18 21 15 15 17 9C18 4 23 3 26 7C30 12 27 20 22 24Z" />
    <linearGradient id="cf-flower-glaze" x1="17" y1="5" x2="25" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".64" />
      <stop offset=".42" stop-color="white" stop-opacity=".04" />
      <stop offset="1" stop-color="white" stop-opacity=".5" />
    </linearGradient>
    <!-- 花心透明镂空：按钮与标题 Logo 共用，直接透出各自背景。 -->
    <mask maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" id="cf-flower-clear-center" width="44" height="44" mask-type="luminance" y="0">
      <rect width="44" height="44" fill="white" />
      <circle cx="22" cy="22" r="3.1" fill="black" />
    </mask>
  </defs>
  <g class="cf-launcher-flower" mask="url(#cf-flower-clear-center)">
    <g class="cf-flower-sway cf-launcher-motion">
      <g transform="rotate(0 22 22)">
        <g class="cf-flower-launch">
          <g class="cf-flower-petal cf-launcher-motion" style="--cf-petal-color: #e45b96; --cf-petal-delay: 0s">
            <use href="#cf-flower-petal-form" fill="var(--cf-petal-color)" />
            <use href="#cf-flower-petal-form" fill="url(#cf-flower-glaze)" />
          </g>
        </g>
      </g>
      <g transform="rotate(45 22 22)">
        <g class="cf-flower-launch">
          <g class="cf-flower-petal cf-launcher-motion" style="--cf-petal-color: #ef8875; --cf-petal-delay: -0.7s">
            <use href="#cf-flower-petal-form" fill="var(--cf-petal-color)" />
            <use href="#cf-flower-petal-form" fill="url(#cf-flower-glaze)" />
          </g>
        </g>
      </g>
      <g transform="rotate(90 22 22)">
        <g class="cf-flower-launch">
          <g class="cf-flower-petal cf-launcher-motion" style="--cf-petal-color: #e8bd58; --cf-petal-delay: -1.4s">
            <use href="#cf-flower-petal-form" fill="var(--cf-petal-color)" />
            <use href="#cf-flower-petal-form" fill="url(#cf-flower-glaze)" />
          </g>
        </g>
      </g>
      <g transform="rotate(135 22 22)">
        <g class="cf-flower-launch">
          <g class="cf-flower-petal cf-launcher-motion" style="--cf-petal-color: #85bc75; --cf-petal-delay: -2.1s">
            <use href="#cf-flower-petal-form" fill="var(--cf-petal-color)" />
            <use href="#cf-flower-petal-form" fill="url(#cf-flower-glaze)" />
          </g>
        </g>
      </g>
      <g transform="rotate(180 22 22)">
        <g class="cf-flower-launch">
          <g class="cf-flower-petal cf-launcher-motion" style="--cf-petal-color: #43b8af; --cf-petal-delay: -2.8s">
            <use href="#cf-flower-petal-form" fill="var(--cf-petal-color)" />
            <use href="#cf-flower-petal-form" fill="url(#cf-flower-glaze)" />
          </g>
        </g>
      </g>
      <g transform="rotate(225 22 22)">
        <g class="cf-flower-launch">
          <g class="cf-flower-petal cf-launcher-motion" style="--cf-petal-color: #62a9d5; --cf-petal-delay: -3.5s">
            <use href="#cf-flower-petal-form" fill="var(--cf-petal-color)" />
            <use href="#cf-flower-petal-form" fill="url(#cf-flower-glaze)" />
          </g>
        </g>
      </g>
      <g transform="rotate(270 22 22)">
        <g class="cf-flower-launch">
          <g class="cf-flower-petal cf-launcher-motion" style="--cf-petal-color: #8681d5; --cf-petal-delay: -4.2s">
            <use href="#cf-flower-petal-form" fill="var(--cf-petal-color)" />
            <use href="#cf-flower-petal-form" fill="url(#cf-flower-glaze)" />
          </g>
        </g>
      </g>
      <g transform="rotate(315 22 22)">
        <g class="cf-flower-launch">
          <g class="cf-flower-petal cf-launcher-motion" style="--cf-petal-color: #bc7bc5; --cf-petal-delay: -4.9s">
            <use href="#cf-flower-petal-form" fill="var(--cf-petal-color)" />
            <use href="#cf-flower-petal-form" fill="url(#cf-flower-glaze)" />
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
