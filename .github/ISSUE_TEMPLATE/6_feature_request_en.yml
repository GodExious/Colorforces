name: ✨ Feature Request (English)
description: Propose a brand-new feature or integration
title: "[Feature]: "
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the in-script "Roadmap" panel for upcoming milestones before submitting.
        *(For improving existing features, please use "Optimization" instead)*

  - type: textarea
    id: feature_desc
    attributes:
      label: Feature Description
      description: Describe the proposed feature and its core concept.
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: What problem does this solve, and in what scenario would you use it?
    validations:
      required: true

  - type: textarea
    id: solution_or_mockup
    attributes:
      label: Design / Mockups (Optional)
      description: Any layout ideas, UI entry points, or visual mockups.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives / References (Optional)
      description: Any other tools, scripts, or platforms that have similar implementations?
